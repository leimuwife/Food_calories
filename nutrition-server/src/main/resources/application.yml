server:
  address: 0.0.0.0
  port: 8088

spring:
  application:
    name: nutrition-server
  jackson:
    generator:
      write-numbers-as-strings: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/nutrition_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 6000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-names:
        - user
        - diet
        - blacklist
      custom-cache-config:
        user:
          ttl: 30m
        diet:
          ttl: 30m
        blacklist:
          ttl: 7d

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleteFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:NutritionAssistantJwtSecretKey2024MustBeAtLeast256BitsLong!!}
  expiration: 604800000

aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: nutrition-file-202607
    domain:

logging:
  level:
    com.nutrition: debug
    org.springframework.web: info

nutrition:
  default-image:
    food: https://nutrition-file-202607.oss-cn-beijing.aliyuncs.com/default/food-placeholder.png

wx:
  mini:
    app-id: ${WX_MINI_APPID:}
    app-secret: ${WX_MINI_APPSECRET:}
    token-expire-seconds: 7200
    token-refresh-seconds: 60
    audit-version: ${WX_AUDIT_VERSION:1}

# Python-FastAPI AI服务配置
fastapi:
  base-url: ${FASTAPI_BASE_URL:http://localhost:8004}
  api-secret-key: ${FASTAPI_SECRET_KEY:}
  estimate-path: /api/ai/estimate-calorie
  chat-path: /api/ai/chat
  knowledge-upload-path: /api/rag/document/upload
  knowledge-delete-path: /api/rag/document/delete
  knowledge-search-path: /api/rag/search/query
  connect-timeout: 10
  read-timeout: 120