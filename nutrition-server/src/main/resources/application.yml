server:
  port: 8088

spring:
  application:
    name: nutrition-server

  # MySQL 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/nutrition_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: wcc1469854950
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发环境打印 SQL
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: NutritionAssistantJwtSecretKey2024MustBeAtLeast256BitsLong!!  # 生产环境请更换为安全密钥
  expiration: 604800000  # 7天，单位毫秒

# 第三方营养 API 配置（可选）
nutrition:
  api:
    # USDA FoodData Central API
    usda:
      enabled: false
      base-url: https://api.nal.usda.gov/fdc/v1
      api-key: YOUR_USDA_API_KEY  # 在 https://fdc.nal.usda.gov/api-key-signup.html 申请
    # 国内备用 API（根据实际对接填写）
    backup:
      enabled: false
      base-url: https://example-nutrition-api.com
      api-key: YOUR_BACKUP_API_KEY

# 日志级别
logging:
  level:
    com.nutrition: debug
    org.springframework.web: info
