server:
  address: 0.0.0.0
  port: 8088

spring:
  application:
    name: nutrition-server
  jackson:
    generator:
      write-numbers-as-strings: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/nutrition_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 6000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-names:
        - user
        - diet
        - blacklist
      custom-cache-config:
        user:
          ttl: 30m
        diet:
          ttl: 30m
        blacklist:
          ttl: 7d

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 使用 SLF4J，SQL 日志受 logging.level 控制；禁止生产环境使用 StdOutImpl 绕过日志级别直写 stdout
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.slf4j.Slf4jImpl}
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleteFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 生产环境必须通过环境变量 JWT_SECRET 注入随机密钥（建议 openssl rand -base64 64）
  # 不提供默认值：未设置时应用启动失败，避免使用可预测的仓库默认密钥
  secret: ${JWT_SECRET}
  expiration: 604800000

aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: nutrition-file-202607
    domain:
    # 私有 Bucket 模式：true 时上传不设公开读，读取由后端生成短期签名 URL。
    # 开启后必须同时在阿里云控制台把 Bucket 读写权限改为「私有」，否则旧对象仍是公开的。
    private-bucket: ${OSS_PRIVATE_BUCKET:false}
    signed-url-expire-seconds: ${OSS_SIGNED_URL_EXPIRE_SECONDS:3600}

logging:
  level:
    # 生产默认 INFO，避免 DEBUG 级别把用户内容等敏感信息写入日志
    com.nutrition: ${LOG_LEVEL_COM_NUTRITION:INFO}
    org.springframework.web: info

# Swagger / OpenAPI 默认关闭，防止公网匿名访问接口文档。
# 仅在本地开发时通过 SWAGGER_ENABLED=true 打开；开启后仍受 ADMIN 鉴权保护（见 JwtAuthFilter）。
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

nutrition:
  default-image:
    food: https://nutrition-file-202607.oss-cn-beijing.aliyuncs.com/default/food-placeholder.png

# 跨域来源白名单（逗号分隔）。默认空表示同域部署、不开放跨域。
# 例如：app.cors.allowed-origins=https://www.example.com,https://admin.example.com
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

wx:
  mini:
    app-id: ${WX_MINI_APPID:}
    app-secret: ${WX_MINI_APPSECRET:}
    token-expire-seconds: 7200
    token-refresh-seconds: 60
    audit-version: ${WX_AUDIT_VERSION:1}

# Python-FastAPI AI服务配置
fastapi:
  base-url: ${FASTAPI_BASE_URL:http://localhost:8004}
  api-secret-key: ${FASTAPI_SECRET_KEY:}
  estimate-path: /api/ai/estimate-calorie
  chat-path: /api/ai/chat
  health-report-path: /api/ai/health-report
  knowledge-upload-path: /api/rag/document/upload
  knowledge-delete-path: /api/rag/document/delete
  knowledge-search-path: /api/rag/search/query
  connect-timeout: 10
  read-timeout: 120
